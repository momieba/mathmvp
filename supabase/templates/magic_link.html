<h2>Dein Anmeldecode</h2>
<p>Gib diesen Code in der App ein:</p>
<p style="font-size: 28px; font-weight: bold; letter-spacing: 6px">{{ .Token }}</p>
<p>Oder melde dich direkt über diesen Link an (im selben Browser öffnen):</p>
<p><a href="{{ .ConfirmationURL }}">Jetzt anmelden</a></p>
<p style="color: #666; font-size: 12px">
  Der Code ist 15 Minuten gültig. Wenn du dich nicht anmelden wolltest, kannst du diese E-Mail
  ignorieren.
</p>
